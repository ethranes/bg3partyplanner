<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Shared build, level and gear planner for a four-player Baldur's Gate 3 Honour Mode party.">
<title>BG3 Party Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: one column, max 1080px; sticky tab bar; each page is a stack of sections.
   Ground is a cool lichen-grey, like a field journal; each character has its own ink. */
:root{
  --bg:#EDEFEA; --surface:#F8F9F6; --sunk:#E3E7E1; --line:#C9D0C6; --ink:#19211E; --muted:#535E58;
  --accent:#2C5C50; --accent-ink:#F8F9F6; --danger:#A3392A;
  --sorc:#2B5D8C; --druid:#4A6726; --assassin:#674C8C; --cleric:#8E620C;
  --f-display:"Alegreya SC", "Palatino Linotype", Georgia, serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131917; --surface:#1B2320; --sunk:#222C28; --line:#34413C; --ink:#E5EBE7; --muted:#A1ADA6;
  --accent:#86C3B1; --accent-ink:#131917; --danger:#EC8B7C;
  --sorc:#86B6E4; --druid:#A9C97D; --assassin:#BDA6E4; --cleric:#E3BA62; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131917; --surface:#1B2320; --sunk:#222C28; --line:#34413C; --ink:#E5EBE7; --muted:#A1ADA6;
  --accent:#86C3B1; --accent-ink:#131917; --danger:#EC8B7C;
  --sorc:#86B6E4; --druid:#A9C97D; --assassin:#BDA6E4; --cleric:#E3BA62; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(34px,6vw,52px)}
h2{font-size:clamp(24px,4vw,30px)}
h3{font-size:20px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:14px}
p{margin:0;max-width:68ch}

/* tab bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tab{appearance:none;font:inherit;font-size:15px;font-weight:700;min-height:42px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.tab:hover{border-color:var(--ink)}
.tab[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex-shrink:0}
.status{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status .pip{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.live .pip{background:var(--druid)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.live-m{display:none}
@media (max-width:640px){
  .status{margin-left:0;width:100%}
  /* phones: one scrolling row of tabs, and the live status folds into the mode strip */
  .bar-in{padding-block:8px;padding-inline:0}
  .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-inline:16px;width:100%;scroll-padding-inline:16px;
    -webkit-mask-image:linear-gradient(to right,transparent 0,#000 12px,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(to right,transparent 0,#000 12px,#000 calc(100% - 24px),transparent)}
  .tabs::-webkit-scrollbar{display:none}
  .tab{min-height:36px;padding:0 12px;font-size:14px;white-space:nowrap;flex-shrink:0}
  .status{padding-inline:16px}
  .status.live{display:none}
  .modebar-in{flex-wrap:nowrap;padding-block:6px;gap:10px}
  .modebar .mode{font-size:14px;min-width:0}
  .modebar .desc{display:none}
  .modebar .live-m{display:flex;align-items:center;gap:6px;margin-left:auto;font-family:var(--f-mono);font-size:12px;opacity:.8}
  .modebar .live-m .pip{width:8px;height:8px;border-radius:50%;background:currentColor}
  .modebar[data-mode="view"] .live-m .pip{background:var(--druid)}
  .modebar .btn{min-height:34px;padding:0 14px;font-size:14px;flex-shrink:0}
}
/* view / edit mode strip, part of the sticky bar so it is always visible */
.modebar{border-top:1px solid var(--line);background:var(--sunk)}
.modebar[data-mode="edit"]{background:var(--accent);color:var(--accent-ink);border-top-color:var(--accent)}
.modebar-in{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:8px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.modebar .mode{display:flex;align-items:center;gap:8px;font-size:15px}
.modebar .mode b{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.modebar .mode svg{width:18px;height:18px;flex-shrink:0}
.modebar .btn{min-height:40px}
.modebar[data-mode="edit"] .btn{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}

.page{display:flex;flex-direction:column;gap:28px;padding-top:28px}
.head{display:flex;flex-direction:column;gap:8px;padding-bottom:18px;border-bottom:2px solid var(--ink)}
.subtabs{display:flex;flex-wrap:wrap;gap:6px}
.notice{border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--surface);padding:12px 16px;border-radius:6px;font-size:15px}
.notice[data-kind="warn"]{border-left-color:var(--cleric)}

/* party cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.pc{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pc .role{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--c);font-weight:600}
.pc h3{font-size:24px}
.pc .cls{font-size:14.5px;color:var(--muted)}
.meter{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--c)}
.pc .count{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.player{display:flex;flex-direction:column;gap:4px}
.player label{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;min-height:42px;width:100%;min-width:0}
textarea{min-height:76px;resize:vertical}
input[type="checkbox"]{width:22px;height:22px;min-height:0;padding:0;accent-color:var(--accent);flex-shrink:0}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px;align-items:start}
.box{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.box > .eyebrow{margin-bottom:2px}
ul.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
ul.list li{padding-left:16px;position:relative;font-size:15px;line-height:1.45;color:var(--muted)}
ul.list li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
ul.list b,.kv b,.tbl b{color:var(--ink)}
.kv{display:flex;flex-direction:column}
.kv div{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.kv dt,.kv .k{font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.kv .v{color:var(--muted)}
@media (max-width:480px){.kv div{grid-template-columns:1fr;gap:2px}}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.stat{border:1px solid var(--line);border-radius:6px;padding:8px 2px;text-align:center;background:var(--bg)}
.stat.hi{border-color:var(--c);border-width:2px}
.stat span{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.stat strong{font-family:var(--f-display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}

.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:top;color:var(--muted)}
.tbl td:first-child{font-family:var(--f-mono);color:var(--c,var(--accent));font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl td:nth-child(2){color:var(--ink);font-weight:700;white-space:nowrap}
.tbl.plain td:first-child{font-family:var(--f-body);color:var(--ink);white-space:normal}
.tbl.plain td:nth-child(2){font-weight:400;white-space:nowrap}

/* gear */
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:2px 8px;white-space:nowrap}
.slot{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.opt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:1px 5px}
.act{display:flex;flex-direction:column;gap:12px}
.act-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.act-h p{font-size:14px;color:var(--muted)}
.stop{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stop-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:12px 16px;background:var(--sunk)}
.stop-h h3{font-family:var(--f-body);font-size:17px;font-weight:700}
.stop-h .detail{font-size:14px;color:var(--muted)}
.stop-h .tools{margin-left:auto;display:flex;gap:4px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:12px 16px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .main{display:flex;flex-direction:column;gap:3px;min-width:0}
.item .line1{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.item .name{font-weight:700;font-size:16px}
.item.got .name{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.item .how{font-size:14.5px;color:var(--muted)}
.item .where{font-size:14px;font-weight:700}
.item .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.check{display:flex;align-items:center;min-height:28px}
.ibtn{appearance:none;font:inherit;font-size:13px;font-weight:700;min-height:36px;min-width:36px;padding:0 10px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.ibtn:hover{border-color:var(--ink)}
.ibtn.danger{color:var(--danger);border-color:var(--danger)}
.ibtn:disabled{opacity:.4;cursor:default}
.btn{appearance:none;font:inherit;font-weight:700;font-size:15px;min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.empty{padding:18px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:15px}
.confirm{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;color:var(--danger);font-weight:700}
@media (max-width:560px){
  .item{grid-template-columns:auto minmax(0,1fr)}
  .item .acts{grid-column:2;justify-content:flex-start}
}

/* sheet (add/edit form) */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:16px}
@media (min-width:700px){.scrim{align-items:center}}
.sheet{background:var(--surface);color:var(--ink);border-radius:12px;width:min(560px,100%);max-height:calc(100% - 16px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.field .lab{font-size:13px;font-weight:700;letter-spacing:.03em}
.field .hint{font-size:13px;color:var(--muted)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.inline{display:flex;align-items:center;gap:10px;font-size:15px}
.err{color:var(--danger);font-size:14px;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:700;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.tab,.ibtn,.btn{transition:border-color .15s,background .15s}}
</style>
</head>

const SPLIT=[['Boots of Stormy Clamour','C','Sorcerer wears Disintegrating Night Walkers instead.'],['Hood of the Weave','S','Cleric keeps the Holy Lance Helm; it feeds the Reverberation combo.'],['Cloak of the Weave','S','Cleric wears the Thunderskin Cloak.'],["Ketheric's Shield",'S',"Cleric uses the Sentinel Shield, then Viconia's Walking Fortress."],['Cloak of Displacement','A',"The Assassin's old Cloak of Protection goes to whoever has no cloak yet."],['Ring of Protection','D',"The tank gets the AC. Sorcerer takes Crusher's Ring."],['Bow of Awareness','C','Sorcerer gets initiative from the Alert feat instead.'],['Callous Glow Ring','C',"Core to the Cleric's radiant combo."],['Adamantine Forge','D','Two crafts: a Scimitar for the Druid and a Shield for the Cleric.'],['Mirror of Loss (+2 stat)','S','Both caster guides want it (CHA for the Sorcerer, WIS for the Cleric). Decide before you get there.']];

/* ---------- state ---------- */
const S={stops:[],items:[],players:{},db:null,status:'connecting',loaded:{stops:false,items:false},editing:false,arrange:false,confirmDel:null,pass:null};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cvar=k=>`--c:var(${CH[k].v})`;
const chip=k=>`<span class="chip" style="${cvar(k)}"><span class="dot"></span>${esc(CH[k].name)}</span>`;
const stopById=id=>S.stops.find(s=>s.id===id);
const sortedStops=()=>[...S.stops].sort((a,b)=>(a.act-b.act)||(a.order-b.order));
const itemsFor=(pred)=>S.items.filter(pred).sort((a,b)=>{const sa=stopById(a.stopId),sb=stopById(b.stopId);const oa=sa?sa.act*1e6+sa.order:9e9,ob=sb?sb.act*1e6+sb.order:9e9;return (oa-ob)||((a.created||0)-(b.created||0));});
const writable=()=>S.editing&&!!S.db&&S.status!=='offline';

/* ---------- routing ---------- */
function route(){const h=(location.hash||'').slice(1);return h||'party';}
function go(r){if(location.hash.slice(1)!==r){location.hash=r;}else render();window.scrollTo(0,0);}
addEventListener('hashchange',()=>{S.confirmDel=null;render();window.scrollTo(0,0);});

function renderNav(){
  const r=route();const base=r.split('-')[0];
  const tabs=[['party','Party',null],['route','Gear route',null],...ORDER.map(k=>[CH[k].slug,CH[k].name,k])];
  const st=S.status==='live'?'<span class="status live"><span class="pip"></span>Live</span>'
    :S.status==='offline'?'<span class="status"><span class="pip"></span>Gear lists unavailable</span>'
    :'<span class="status"><span class="pip"></span>Connecting…</span>';
  renderModebar();
  const nav=document.getElementById('nav');
  nav.innerHTML='<div class="tabs" id="tabs">'+tabs.map(([id,l,k])=>`<a class="tab" href="#${id}" ${base===id?'aria-current="page"':''} ${k?`style="${cvar(k)}"`:''}>${k?'<span class="dot"></span>':''}${esc(l)}</a>`).join('')+'</div>'+st;
  // on phones the tabs are one scrolling row: keep the current tab in view
  const row=document.getElementById('tabs'),cur=row.querySelector('[aria-current]');
  if(cur&&row.scrollWidth>row.clientWidth)row.scrollLeft=cur.offsetLeft-(row.clientWidth-cur.offsetWidth)/2;
}

const ICON_EYE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const ICON_PEN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>';
function renderModebar(){
  const el=document.getElementById('modebar');
  if(!S.db||S.status!=='live'){el.hidden=true;return;}
  el.hidden=false;el.dataset.mode=S.editing?'edit':'view';
  el.innerHTML=S.editing
    ?`<div class="modebar-in"><span class="mode">${ICON_PEN}<span><b>Edit mode</b><span class="desc"> · Changes save for everyone.</span></span></span><span class="live-m"><span class="pip"></span>Live</span><button class="btn" data-mode="view">Done<span class="desc"> editing</span></button></div>`
    :`<div class="modebar-in"><span class="mode">${ICON_EYE}<span><b>View only</b><span class="desc"> · Ticking and editing are locked.</span></span></span><span class="live-m"><span class="pip"></span>Live</span><button class="btn" data-mode="edit">Edit mode</button></div>`;
}

/* ---------- pages ---------- */
function accessNote(){
  if(S.status==='offline')return `<div class="notice" data-kind="warn">The shared gear lists couldn't load. Check your connection and reload the page.</div>`;
  return '';
}
function loadingOr(html){
  if(S.status==='offline')return '';
  if(!S.loaded.items||!S.loaded.stops)return `<div class="empty">Loading the party's gear list…</div>`;
  return html;
}

function pageParty(){
  const cards=ORDER.map(k=>{
    const b=BUILD[k];const mine=S.items.filter(i=>i.who===k);const got=mine.filter(i=>i.got).length;const pct=mine.length?Math.round(got/mine.length*100):0;
    const pname=S.players[k]||'';
    return `<article class="pc" style="${cvar(k)}">
      <div class="role">${esc(b.role)}</div>
      <h3>${esc(CH[k].name)}</h3>
      <div class="cls">${esc(b.line)}</div>
      <div class="small">Suggested race: <b>${esc(b.race)}</b></div>
      ${S.loaded.items?`<div class="meter" aria-hidden="true"><i style="width:${pct}%"></i></div><div class="count">${got} of ${mine.length} items collected</div>`:''}
      <div class="player"><label for="pl-${k}">Player</label>
        <input id="pl-${k}" data-player="${k}" value="${esc(pname)}" placeholder="Who's playing?" ${writable()?'':'disabled'} autocomplete="off"></div>
      <div class="toolbar"><a class="tab" href="#${CH[k].slug}">Gear</a><a class="tab" href="#${CH[k].slug}-build">Build</a></div>
    </article>`;}).join('');
  const split=SPLIT.map(([it,k,t])=>`<tr><td>${esc(it)}</td><td>${chip(k)}</td><td>${esc(t)}</td></tr>`).join('');
  return `<section class="page">
    <div class="head"><div class="eyebrow">Baldur's Gate 3 · Honour Mode · 4-player co-op</div><h1>The Party</h1>
      <p class="muted">Four builds, the guides they come from, and who gets which gear. Each character's gear list is shared: tick items off as you get them, or add, edit and remove items, and everyone sees it.</p></div>
    ${accessNote()}
    <div class="cards">${cards}</div>
    <h2>Who gets the contested gear</h2>
    <div class="tblwrap"><table class="tbl plain"><thead><tr><th>Wanted by two of you</th><th>Goes to</th><th>The other one takes</th></tr></thead><tbody>${split}</tbody></table></div>
    <div class="grid2">
      <div class="box"><div class="eyebrow">Points of no return</div><ul class="list">
        <li><b>Leaving Act 1</b> (Mountain Pass or Underdark exit) locks off the Grove, Underdark, Grymforge, Rosymorn and the Crèche. Clear the Act 1 list first.</li>
        <li><b>Entering the Mind Flayer Colony</b> ends Act 2. Get Moonrise Towers and Gauntlet of Shar loot before then.</li>
        <li><b>Don't attack the Grove</b> if you want Dammon's Act 2 stock.</li>
        <li><b>Potent Robe</b> isn't available to a Dark Urge character.</li></ul></div>
      <div class="box"><div class="eyebrow">How the party fits together</div><ul class="list">
        <li><b>Wet, then freeze.</b> The Druid and Cleric cast Create Water so the Sorcerer's cold damage doubles.</li>
        <li><b>Assassin opens;</b> everyone else waits out of sight until the first shot.</li>
        <li><b>Druid holds the front</b> in Bear form; the Cleric runs Spirit Guardians through the enemy line behind.</li>
        <li><b>Sorcerer does the talking</b> (highest Charisma); the Cleric and Druid cover Wisdom checks.</li>
        <li><b>Honour Mode:</b> one save, no reloads. Long rest before big fights, carry 2 Scrolls of Revivify each, and respec with Withers (100 gold) if a build isn't working.</li></ul></div>
    </div></section>`;
}

function itemRow(it,{showWho,showWhere}){
  const st=stopById(it.stopId);const w=writable();
  const del=S.confirmDel===it.id;
  return `<div class="item ${it.got?'got':''}" style="${cvar(it.who)}">
    <div class="check"><input type="checkbox" id="got-${esc(it.id)}" data-got="${esc(it.id)}" ${it.got?'checked':''} ${w?'':'disabled'} aria-label="Got ${esc(it.name)}"></div>
    <div class="main">
      <div class="line1"><label class="name" for="got-${esc(it.id)}">${esc(it.name)}</label><span class="slot">${esc(it.slot)}</span>${it.optional?'<span class="opt">optional</span>':''}${showWho?chip(it.who):''}</div>
      ${showWhere&&st?`<div class="where">${esc(st.name)}</div>`:''}
      ${it.how?`<div class="how">${esc(it.how)}</div>`:''}
    </div>
    ${w?`<div class="acts">${del?`<span class="confirm">Remove it? <button class="ibtn danger" data-delyes="${esc(it.id)}">Remove</button><button class="ibtn" data-delno>Keep</button></span>`:`<button class="ibtn" data-edit="${esc(it.id)}">Edit</button><button class="ibtn" data-del="${esc(it.id)}" aria-label="Remove ${esc(it.name)}">Remove</button>`}</div>`:''}
  </div>`;
}

function pageGear(k){
  const b=BUILD[k];const mine=itemsFor(i=>i.who===k);const got=mine.filter(i=>i.got).length;
  let body='';
  for(const a of [1,2,3]){
    const list=mine.filter(i=>(stopById(i.stopId)?.act||3)===a);
    if(!list.length)continue;
    body+=`<div class="act"><div class="act-h"><h2>Act ${a}</h2></div><div class="stop">${list.map(it=>itemRow(it,{showWho:false,showWhere:true})).join('')}</div></div>`;
  }
  if(!body)body=`<div class="empty">No gear on ${esc(CH[k].name)}'s list yet. ${writable()?'Use <b>Add item</b> to add the first one.':''}</div>`;
  return `<section class="page" style="${cvar(k)}">
    <div class="head"><div class="eyebrow">${esc(CH[k].name)}${S.players[k]?' · '+esc(S.players[k]):''}</div><h1>Gear checklist</h1>
      <p class="muted">In the order you'll reach it. Tick items off as you get them. ${S.loaded.items?`<b>${got} of ${mine.length}</b> collected.`:''}</p></div>
    ${subtabs(k,'gear')}
    ${accessNote()}
    ${writable()?`<div class="toolbar"><button class="btn" data-add="${k}">Add item</button></div>`:''}
    ${loadingOr(body)}
  </section>`;
}

function subtabs(k,cur){return `<div class="subtabs"><a class="tab" href="#${CH[k].slug}" ${cur==='gear'?'aria-current="page"':''}>Gear checklist</a><a class="tab" href="#${CH[k].slug}-build" ${cur==='build'?'aria-current="page"':''}>Build &amp; levels</a></div>`;}

function pageBuild(k){
  const b=BUILD[k];
  const kv=b.create.map(([a,v])=>`<div><span class="k">${esc(a)}</span><span class="v">${v}</span></div>`).join('');
  const stats=Object.entries(b.stats).map(([n,v])=>`<div class="stat ${b.hi.includes(n)?'hi':''}"><span>${n}</span><strong>${v}</strong></div>`).join('');
  const head=b.levelHead||['Lvl','Take','What to pick / what you get'];
  const lv=b.levels.map(r=>`<tr><td>${r[0]}</td><td>${esc(r[1])}</td><td>${r[2]}</td></tr>`).join('');
  return `<section class="page" style="${cvar(k)}">
    <div class="head"><div class="eyebrow">${esc(b.role)}</div><h1>${esc(CH[k].name)}</h1>
      <p><b>${esc(b.line)}</b></p><p class="muted">${esc(b.blurb)}</p>
      <p class="small">Guide: <a href="${b.guide[0]}" target="_blank" rel="noopener">${esc(b.guide[1])}</a></p></div>
    ${subtabs(k,'build')}
    <div class="grid2">
      <div class="box"><div class="eyebrow">Character creator</div><div class="kv">${kv}</div><div class="stats">${stats}</div>${b.statNote?`<p class="small muted">${esc(b.statNote)}</p>`:''}</div>
      <div class="box"><div class="eyebrow">How to play it</div><ul class="list">${b.play.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    </div>
    <h2>${k==='D'?'Milestones, 1 to 12':'Level-up plan, 1 to 12'}</h2>
    <div class="tblwrap"><table class="tbl"><thead><tr><th>${head[0]}</th><th>${head[1]}</th><th>${head[2]}</th></tr></thead><tbody>${lv}</tbody></table></div>
    <div class="box"><div class="eyebrow">${esc(b.extra[0])}</div><ul class="list">${b.extra[1].map(x=>`<li>${x}</li>`).join('')}</ul></div>
  </section>`;
}

function pageRoute(){
  const w=writable();
  let body='';
  for(const a of [1,2,3]){
    const stops=sortedStops().filter(s=>s.act===a);
    let html='';
    stops.forEach((s,idx)=>{
      const its=itemsFor(i=>i.stopId===s.id);
      if(!its.length&&!S.arrange)return;
      const tools=S.arrange&&w?`<div class="tools"><button class="ibtn" data-up="${esc(s.id)}" ${idx===0?'disabled':''} aria-label="Move ${esc(s.name)} up">▲</button><button class="ibtn" data-down="${esc(s.id)}" ${idx===stops.length-1?'disabled':''} aria-label="Move ${esc(s.name)} down">▼</button><button class="ibtn" data-rename="${esc(s.id)}">Rename</button></div>`:'';
      html+=`<div class="stop"><div class="stop-h"><h3>${esc(s.name)}</h3>${s.detail?`<span class="detail">${esc(s.detail)}</span>`:''}${tools}</div>
        ${its.length?its.map(it=>itemRow(it,{showWho:true,showWhere:false})).join(''):`<div class="item"><div></div><div class="muted small">No items here yet.</div></div>`}</div>`;
    });
    if(!html)html=`<div class="empty">Nothing on anyone's list in Act ${a} yet.</div>`;
    body+=`<div class="act"><div class="act-h"><h2>Act ${a}</h2><p>${ACTNOTE[a]}</p></div>${html}</div>`;
  }
  return `<section class="page">
    <div class="head"><div class="eyebrow">Whole party</div><h1>Gear route</h1>
      <p class="muted">Every item on everyone's list, grouped by where you get it, in route order. Add an item on your own gear page and it shows up here under its location.</p></div>
    ${accessNote()}
    ${w?`<div class="toolbar"><button class="btn ghost" data-editmode>${S.arrange?'Done arranging':'Arrange locations'}</button>${S.arrange?'<span class="small muted">Move locations up or down to match the order you play them. Empty locations show while arranging.</span>':''}</div>`:''}
    ${loadingOr(body)}
  </section>`;
}

function render(){
  renderNav();
  const r=route();const app=document.getElementById('app');
  let html;
  if(r==='party')html=pageParty();
  else if(r==='route')html=pageRoute();
  else{
    const k=ORDER.find(k=>r===CH[k].slug||r===CH[k].slug+'-build');
    if(!k)html=pageParty();
    else html=r.endsWith('-build')?pageBuild(k):pageGear(k);
  }
  // keep focus on a player name input while others update
  const ae=document.activeElement;const keep=ae&&ae.dataset&&ae.dataset.player?ae.dataset.player:null;
  const sel=keep?[ae.selectionStart,ae.selectionEnd,ae.value]:null;
  app.innerHTML=html;
  if(keep){const el=app.querySelector(`[data-player="${keep}"]`);if(el){el.value=sel[2];el.focus();try{el.setSelectionRange(sel[0],sel[1]);}catch(e){}}}
}

/* ---------- toast ---------- */
let toastT;
function toast(msg){const h=document.getElementById('toastHost');h.innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>h.innerHTML='',2600);}
function fail(e){
  if(e&&e.cancelled)return;
  if(e&&e.code==='28P01'){toast("The passcode has changed. Press Edit mode and enter the new one.");return;}
  if(e&&e.code==='PGRST202'){toast("That change isn't switched on in the database yet.");return;}
  toast("Couldn't save that. Check your connection and try again.");
}

/* ---------- passcode ---------- */
function loadPass(){try{return localStorage.getItem(PASS_KEY);}catch(e){return null;}}
function savePass(p){S.pass=p;try{p?localStorage.setItem(PASS_KEY,p):localStorage.removeItem(PASS_KEY);}catch(e){}}
function setEditing(on){
  S.editing=on;S.confirmDel=null;if(!on)S.arrange=false;
  try{localStorage.setItem(EDIT_KEY,on?'1':'0');}catch(e){}
  render();
}
// Resolves to the passcode, asking for it (and checking it) the first time on this device. Rejects if cancelled.
function needPass(){
  if(S.pass)return Promise.resolve(S.pass);
  return new Promise((resolve,reject)=>{
    const host=document.getElementById('sheetHost');
    host.innerHTML=`<div class="scrim" id="scrim"><form class="sheet" id="pcForm" role="dialog" aria-modal="true" aria-labelledby="pcT" novalidate>
      <h2 id="pcT">Party passcode</h2>
      <p class="muted">Anyone can view the lists. To change them, enter the passcode your party shares. This device remembers it.</p>
      <div class="field"><label for="pc-code">Passcode</label><input id="pc-code" type="password" autocomplete="current-password" required></div>
      <div class="err" id="pc-err" hidden></div>
      <div class="toolbar"><button class="btn" type="submit" id="pc-ok">Unlock editing</button><button class="btn ghost" type="button" id="pc-cancel">Cancel</button></div></form></div>`;
    const $=id=>document.getElementById(id);
    const cancel=()=>{host.innerHTML='';reject({cancelled:true});};
    $('pc-cancel').onclick=cancel;
    $('scrim').addEventListener('click',e=>{if(e.target.id==='scrim')cancel();});
    $('pcForm').addEventListener('keydown',e=>{if(e.key==='Escape')cancel();});
    $('pc-code').focus();
    $('pcForm').onsubmit=async ev=>{
      ev.preventDefault();const p=$('pc-code').value.trim();const err=$('pc-err');err.hidden=true;
      if(!p){err.textContent='Enter the passcode.';err.hidden=false;return;}
      $('pc-ok').disabled=true;
      const {error}=await S.db.rpc('check_passcode',{p_passcode:p});
      $('pc-ok').disabled=false;
      if(error){err.textContent=error.code==='28P01'?"That passcode didn't work.":"Couldn't check the passcode. Check your connection.";err.hidden=false;return;}
      savePass(p);host.innerHTML='';resolve(p);
    };
  });
}
// Calls a passcode-checked database function, then refreshes the table it changed.
async function write(fn,args,table){
  const p=await needPass();
  const {data,error}=await S.db.rpc(fn,{p_passcode:p,...args});
  if(error){if(error.code==='28P01'){savePass(null);setEditing(false);}throw error;}
  if(table)loadTable(table);
  return data;
}

/* ---------- add / edit sheet ---------- */
function stopOptions(sel){
  let o='';
  for(const a of [1,2,3]){o+=`<optgroup label="Act ${a}">`+sortedStops().filter(s=>s.act===a).map(s=>`<option value="${esc(s.id)}" ${s.id===sel?'selected':''}>${esc(s.name)}</option>`).join('')+'</optgroup>';}
  return o+`<option value="__new">New location…</option>`;
}
function openSheet({item,who}){
  const it=item||{who,name:'',slot:'Head',stopId:sortedStops()[0]?.id||'__new',how:'',optional:false};
  const names=[...new Set(S.items.map(i=>i.name))].sort();
  const host=document.getElementById('sheetHost');
  host.innerHTML=`<div class="scrim" id="scrim"><form class="sheet" id="itemForm" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" novalidate>
    <h2 id="sheetTitle">${item?'Edit item':'Add item'}</h2>
    <div class="field"><label for="f-name">Item name</label><input id="f-name" list="f-names" required value="${esc(it.name)}" autocomplete="off"><datalist id="f-names">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
      <span class="hint">Pick an item already in the guide to copy its slot and location, or type a new one.</span></div>
    <div class="row2">
      <div class="field"><label for="f-who">For</label><select id="f-who">${ORDER.map(k=>`<option value="${k}" ${k===it.who?'selected':''}>${esc(CH[k].name)}</option>`).join('')}</select></div>
      <div class="field"><label for="f-slot">Slot</label><select id="f-slot">${SLOTS.map(s=>`<option ${s===it.slot?'selected':''}>${s}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label for="f-stop">Where you get it</label><select id="f-stop">${stopOptions(it.stopId)}</select></div>
    <div class="row2" id="newStop" hidden>
      <div class="field"><label for="f-stopname">New location name</label><input id="f-stopname" autocomplete="off"></div>
      <div class="field"><label for="f-stopact">Act</label><select id="f-stopact"><option value="1">Act 1</option><option value="2">Act 2</option><option value="3">Act 3</option></select></div>
    </div>
    <div class="field"><label for="f-how">How to get it <span class="muted">(optional)</span></label><textarea id="f-how" placeholder="e.g. Buy from Grat, or loot from the chest by the door">${esc(it.how)}</textarea></div>
    <label class="inline"><input type="checkbox" id="f-opt" ${it.optional?'checked':''}> Nice to have, not essential</label>
    <div class="err" id="f-err" hidden></div>
    <div class="toolbar"><button class="btn" type="submit" id="f-save">${item?'Save changes':'Add to list'}</button><button class="btn ghost" type="button" id="f-cancel">Cancel</button></div>
  </form></div>`;
  const $=id=>document.getElementById(id);
  const syncNew=()=>{$('newStop').hidden=$('f-stop').value!=='__new';};
  syncNew();$('f-stop').addEventListener('change',syncNew);
  $('f-name').addEventListener('change',()=>{
    if(item)return;const m=S.items.find(i=>i.name.toLowerCase()===$('f-name').value.trim().toLowerCase());
    if(m){$('f-slot').value=m.slot;$('f-stop').value=m.stopId;if(!$('f-how').value)$('f-how').value=m.how||'';syncNew();}
  });
  const close=()=>{host.innerHTML='';};
  $('f-cancel').addEventListener('click',close);
  $('scrim').addEventListener('click',e=>{if(e.target.id==='scrim')close();});
  host.addEventListener('keydown',e=>{if(e.key==='Escape')close();},{once:true});
  $('f-name').focus();
  $('itemForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const name=$('f-name').value.trim();const err=$('f-err');err.hidden=true;
    if(!name){err.textContent='Give the item a name.';err.hidden=false;return;}
    let stopId=$('f-stop').value;
    $('f-save').disabled=true;
    try{
      if(stopId==='__new'){
        const sn=$('f-stopname').value.trim();const act=+$('f-stopact').value;
        if(!sn){err.textContent='Name the new location, or pick one from the list.';err.hidden=false;$('f-save').disabled=false;return;}
        stopId=await write('add_stop',{p_name:sn,p_act:act},'stops');
      }
      const data={who:$('f-who').value,name,slot:$('f-slot').value,stopId,how:$('f-how').value.trim(),optional:$('f-opt').checked};
      await write('save_item',{p_id:item?item.id:null,p_who:data.who,p_name:data.name,p_slot:data.slot,p_stop_id:data.stopId,p_how:data.how,p_optional:data.optional},'items');
      toast(item?'Saved':`Added to ${CH[data.who].name}'s list`);
      close();
    }catch(ex){$('f-save').disabled=false;fail(ex);}
  });
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('button');if(!t)return;
  const d=t.dataset;
  if(d.mode==='edit'){try{await needPass();}catch(ex){return;}setEditing(true);toast('Edit mode on');return;}
  if(d.mode==='view'){setEditing(false);toast('Back to view only');return;}
  if(d.add){openSheet({who:d.add});return;}
  if(d.edit){const it=S.items.find(i=>i.id===d.edit);if(it)openSheet({item:it});return;}
  if(d.del){S.confirmDel=d.del;render();return;}
  if('delno' in d){S.confirmDel=null;render();return;}
  if(d.delyes){S.confirmDel=null;render();try{await write('remove_item',{p_id:d.delyes},'items');toast('Removed');}catch(ex){fail(ex);}return;}
  if('editmode' in d){S.arrange=!S.arrange;render();return;}
  if(d.up||d.down){
    const id=d.up||d.down;const s=stopById(id);const list=sortedStops().filter(x=>x.act===s.act);const i=list.findIndex(x=>x.id===id);
    let order;
    if(d.up){const p=list[i-1],pp=list[i-2];if(!p)return;order=pp?(pp.order+p.order)/2:p.order-10;}
    else{const n=list[i+1],nn=list[i+2];if(!n)return;order=nn?(n.order+nn.order)/2:n.order+10;}
    t.disabled=true;
    try{await write('move_stop',{p_id:id,p_sort_order:order},'stops');}catch(ex){t.disabled=false;fail(ex);}
    return;
  }
  if(d.rename){
    const s=stopById(d.rename);const host=document.getElementById('sheetHost');
    host.innerHTML=`<div class="scrim" id="scrim"><form class="sheet" id="rnForm" role="dialog" aria-modal="true" aria-labelledby="rnT"><h2 id="rnT">Rename location</h2>
      <div class="field"><label for="r-name">Name</label><input id="r-name" value="${esc(s.name)}" autocomplete="off"></div>
      <div class="field"><label for="r-detail">Area <span class="muted">(optional)</span></label><input id="r-detail" value="${esc(s.detail)}" autocomplete="off"></div>
      <div class="toolbar"><button class="btn" type="submit">Save</button><button class="btn ghost" type="button" id="r-cancel">Cancel</button></div></form></div>`;
    const close=()=>host.innerHTML='';
    document.getElementById('r-cancel').onclick=close;
    document.getElementById('rnForm').onsubmit=async ev=>{ev.preventDefault();const n=document.getElementById('r-name').value.trim();if(!n)return;
      try{await write('update_stop',{p_id:s.id,p_name:n,p_detail:document.getElementById('r-detail').value.trim()},'stops');close();toast('Saved');}catch(ex){fail(ex);}};
    document.getElementById('r-name').focus();
  }
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.got){const id=t.dataset.got;const got=t.checked;
    const it=S.items.find(i=>i.id===id);if(it){it.got=got;render();}
    try{await write('set_item_got',{p_id:id,p_got:got},'items');}catch(ex){if(it){it.got=!got;render();}fail(ex);}}
});
let plT={};
document.addEventListener('input',e=>{
  const t=e.target;if(!t.dataset||!t.dataset.player)return;const k=t.dataset.player;
  clearTimeout(plT[k]);plT[k]=setTimeout(async()=>{
    const v=t.value.trim();
    try{await write('set_player',{p_who:k,p_name:v},'players');S.players[k]=v;}catch(ex){fail(ex);}
  },700);
});

/* ---------- boot ---------- */
render();
S.pass=loadPass();
try{S.editing=!!S.pass&&localStorage.getItem(EDIT_KEY)!=='0';}catch(e){}
const MAP={
  stops:r=>({id:r.id,name:r.name,detail:r.detail||'',act:r.act,order:r.sort_order}),
  items:r=>({id:r.id,who:String(r.who).trim(),name:r.name,slot:r.slot,stopId:r.stop_id,how:r.how||'',optional:r.optional,got:r.got,created:r.created})};
async function loadTable(t){
  const {data,error}=await S.db.from(t).select('*');
  if(error){if(!S.loaded.items||!S.loaded.stops){S.status='offline';render();}return;}
  if(t==='players'){S.players={};for(const r of data)S.players[String(r.who).trim()]=r.name||'';}
  else{S[t]=data.map(MAP[t]);S.loaded[t]=true;}
  if(S.status!=='live'&&S.loaded.items&&S.loaded.stops)S.status='live';
  render();
}
const loadAll=()=>Promise.all(['stops','items','players'].map(loadTable));
(async()=>{
  if(!window.supabase){S.status='offline';render();return;}
  S.db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false}});
  await loadAll();
  // Live updates: when anyone changes a table, reload it.
  const pending={};
  const reload=t=>{clearTimeout(pending[t]);pending[t]=setTimeout(()=>loadTable(t),150);};
  let ch=S.db.channel('party');
  for(const t of ['stops','items','players'])ch=ch.on('postgres_changes',{event:'*',schema:'public',table:t},()=>reload(t));
  ch.subscribe();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')loadAll();});
})();
</script>
